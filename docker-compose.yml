services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adrian-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adrian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adrian_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-adrian_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adrian_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adrian} -d ${POSTGRES_DB:-adrian_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Preparado para Fase 4: levantar con `docker compose --profile automation up -d`
  n8n:
    image: n8nio/n8n:latest
    container_name: adrian-ai-n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
    volumes:
      - adrian_n8n:/home/node/.n8n

volumes:
  adrian_pgdata:
  adrian_n8n:
