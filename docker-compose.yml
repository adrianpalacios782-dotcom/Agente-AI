services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adrian-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adrian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-adrian_ai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adrian_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adrian} -d ${POSTGRES_DB:-adrian_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fase 4: levantar con `docker compose --profile automation up -d`
  n8n:
    image: n8nio/n8n:latest
    container_name: adrian-ai-n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      N8N_SECURE_COOKIE: "false"
      ADRIAN_AUTOMATION_TOKEN: ${ADRIAN_AUTOMATION_TOKEN:-}
    volumes:
      - adrian_n8n:/home/node/.n8n

volumes:
  adrian_pgdata:
  adrian_n8n:
